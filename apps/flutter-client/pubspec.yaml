name: nexa_client
description: The Nexa mobile client — the gateway to account, Nexa, memory and devices.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  flutter_secure_storage: ^10.3.1
  qr: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  zxing2: ^0.2.3
  # Build-time only: generates the platform launcher icons from the real
  # Nexa mark. Run `dart run flutter_launcher_icons` after changing the
  # source art in assets/icon/.
  flutter_launcher_icons: ^0.14.4

# The installed app is "NEXA AI" with the real Nexa mark on the near-black
# identity ground — never the Flutter placeholder. Android gets an adaptive
# icon (emerald mark foreground, #0B0E12 background); iOS gets the flat
# 1024 with alpha flattened.
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/nexa-icon.png"
  adaptive_icon_background: "#0B0E12"
  adaptive_icon_foreground: "assets/icon/nexa-icon-foreground.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/marks/
    - assets/devices/

  # Satoshi is the brand face (Fontshare, not Google Fonts), and its licence is
  # not ours to vendor — so the files are not in this repo. Drop the four .otf
  # weights into assets/fonts/, uncomment this block, and flip
  # NexaType.fontFamily in lib/theme/nexa_typography.dart to 'Satoshi'.
  #
  # fonts:
  #   - family: Satoshi
  #     fonts:
  #       - asset: assets/fonts/Satoshi-Light.otf
  #         weight: 300
  #       - asset: assets/fonts/Satoshi-Regular.otf
  #         weight: 400
  #       - asset: assets/fonts/Satoshi-Medium.otf
  #         weight: 500
  #       - asset: assets/fonts/Satoshi-Bold.otf
  #         weight: 700
